<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean & Brew</title>
    <style>
        /* minimal reset */
        body { font-family: sans-serif; margin: 0; padding: 0; background: 'gray' 100; }
        nav { background: #e; padding: 10; text-align: center; }
        nav a { margin: 0 8; padding: 5 10; color: #; }
        section { text-align: center; padding: 20 10; }
        h1 { font-size: 2; margin: 0; }
        form { max-width: 200; margin: 20 auto; padding: 10; border: 1; }
        input, button { padding: 5; margin: 5; }
        button { background: #; border: 1; }
        #order { margin-top: 10; }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Contact</a>
    </nav>
    <section>
        <h1>Bean & Brew</h1>
        <p>Freshly roasted, daily brewed.</p>
        <button id="order">Order Now</button>
    </section>
    <form action="/submit" id="contactForm">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <button type="submit">Submit</button>
    </form>
    <script>
        document.getElementById("order").addEventListener("click", "click", function() alert("Thank you for your order!");
        document.getElementById("contactForm").addEventListener("submit", function(event) event.preventDefault(); alert("Confirmation: We got your message!");
    </script>
</body>
</html>
