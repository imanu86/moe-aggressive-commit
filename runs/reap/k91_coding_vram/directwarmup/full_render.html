<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Single-File Website</title>
    <!-- clean, working code: HTML + CSS + JavaScript in one file -->
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -ds4: CUDA loading model tensors 7.86 GiB cached
apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ----- light/dark theme variables (used via toggle) ----- */
        body.dark {
            background-color: #121212;
            color: #eaeaea;
        }

        body.dark .navbar {
            background-color: #1f1f1f;
            border-bottom: 1px solid #333;
        }

        body.dark .nav-link {
            color: #ddd;
        }

        body.dark .nav-link:hover {
            color: #fff;
            background-color: #333;
        }

        body.dark .hero {
            background: #2c2c2c;
        }

        body.dark .hero-btn {
            background: #bb86fc;
            color: #121212;
        }

        body.dark .hero-btn:hover {
            background: #9b6fdf;
        }

        body.dark .form-container {
            background: #1e1e1e;
            border: 1px solid #333;
        }

        body.dark .form-input {
            background: #2a2a2a;
            color: #eee;
            border: 1px solid #444;
        }

        body.dark .form-input::placeholder {
            color: #aaa;
        }

        body.dark .error-message {
            color: #ff8c8c;
        }

        body.dark .theme-toggle {
            background: #333;
            color: #eee;
            border: 1px solid #555;
        }

        body.dark .theme-toggle:hover {
            background: #444;
        }

        /* ----- layout & components ----- */
        .navbar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1rem 2rem;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            transition: background-color 0.3s, border 0.3s;
        }

        .nav-link {
            text-decoration: none;
            color: #1a1a1a;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: background-color 0.2s, color 0.2s;
        }

        .nav-link:hover {
            background-color: #e0e0e0;
            color: #000;
        }

        /* ----- hero section ----- */
        .
</body>
</html>
