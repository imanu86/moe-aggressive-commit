<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean & Brew</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f0e8; color: #3e2c1a; }
        nav { background: #3e2c1a; padding: 10px; text-align: center; }
       
nav a { color: #f5f0e8; margin: 0 15px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .hero { background: #d4a373; padding: 40px 20px; text-align: center; }
        .hero h1 { font-size: 2.5rem; }
        .hero p { font-size: 1.2rem; margin-top: 8px; }
        #order { margin: 20px; padding: 10px 20px; font-size: 1.1rem; background: #3e2c1a; color: #f5f0e8; border: none; cursor: pointer; border-radius: 4px; }
        form { background: #fff; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 8px; }
        form input { width: 100%; padding: 8px; margin: 5px 0 10px; border: 1px solid #ccc; border-radius: 4px; }
        form button { background: #d4a373; border: none; padding: 10px; width: 100%; font-size: 1rem; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Contact</a>
    </nav>
    <section class="hero">
        <h1>Bean & Brew</h1>
        <p>Fresh coffee, pastel vibe</p>
    </section>
    <button id="order">Order Now</button>
    <form action="/submit">
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
        <button type="submit">Submit</button>
    </form>
    <script>
        document.getElementById("order").addEventListener("click", function(){
            alert("Thank us for your order!");
        });
        document.querySelector("form").addEventListener("submit", function(){
            event.preventDefault();
            alert("Confation: Your submission has been received!");
        });
    </script>
</body>
</html>
