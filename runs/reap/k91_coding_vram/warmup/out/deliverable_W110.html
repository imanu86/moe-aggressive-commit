<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean & Brew</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f5f0e8; color: #2e241f; }
        nav { background: #3b2e1e; padding: 1rem; display: flex; gap: 1.5rem; justify-content: center; }
        nav a { color: #f5f0e8; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .hero { text-align: center; padding: 4rem 1rem; background: #d8c8b4; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .hero p { font-size: 1.25rem; margin-bottom: 1.25rem; }
        #order { background: #3b2e1e; color: #f5f0e8; border: none; padding: 1rem 2rem; font-size: 1.25rem; cursor: pointer; border-radius: 4px; }
        #order:hover { background: #5a4a3a; }
        form { max-width: 450px; margin: 2rem auto; padding: 1rem; background: #fff; border-radius: 8px; display: flex; flex-direction: column; gap: 1rem; }
        form input, form button { padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        form button { background: #3b2e1e; color: #f5f0e8; border: none; cursor: pointer; }
        form button:hover { background: #5a4a3a; }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Contact</a>
    </nav>
    <section class="hero">
        <h1>Bean & Brew</h1>
        <p>Freshly roasted, locally grown, every since zero</p>
        <button id="order">Order Now</button>
    </section>
    <form action="/submit">
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
        <button type="submit">Send</button>
    </form>
    <script>
        document.getElementById('order').addEventListener('click', function() {
            alert('Thank for your order!');
        });
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Confirmation!');
        });
    </script>
</body>
</html>
